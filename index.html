<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetMetric - Coding Challenges</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo">LeetMetric</div>
        <nav>
            <ul>
                <li><a href="#" class="active">Problems</a></li>
                <li><a href="#">Discuss</a></li>
                <li><a href="#">Contest</a></li>
                <li><a href="#">Profile</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <button class="btn login">Sign In</button>
            <button class="btn register">Register</button>
        </div>
    </header>

    <main>
        <div class="sidebar">
            <div class="sidebar-header">
                <h3>Problem List</h3>
                <div class="filter">
                    <select id="difficulty-filter">
                        <option value="all">All Levels</option>
                        <option value="easy">Easy</option>
                        <option value="medium">Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>
            </div>
            <div class="problem-list" id="problem-list">
                <!-- Problems will be loaded here via JavaScript -->
            </div>
        </div>

        <div class="content">
            <div class="problem-content">
                <div class="problem-header">
                    <h1 id="problem-title">Two Sum</h1>
                    <div class="difficulty easy">Easy</div>
                    <div class="actions">
                        <button class="btn like"><i class="far fa-thumbs-up"></i></button>
                        <button class="btn dislike"><i class="far fa-thumbs-down"></i></button>
                        <button class="btn bookmark"><i class="far fa-bookmark"></i></button>
                    </div>
                </div>
                
                <div class="problem-description" id="problem-description">
                    <!-- Problem description will be loaded here -->
                </div>
                
                <div class="code-editor">
                    <div class="editor-header">
                        <select id="language-select">
                            <option value="javascript">JavaScript</option>
                            <option value="python">Python</option>
                            <option value="java">Java</option>
                            <option value="c++">C++</option>
                        </select>
                        <button class="btn reset-code"><i class="fas fa-undo"></i> Reset</button>
                    </div>
                    <textarea id="editor">function twoSum(nums, target) {
    // Your code here
};</textarea>
                    <div class="editor-footer">
                        <button class="btn run-code">Run Code</button>
                        <button class="btn submit-code">Submit</button>
                    </div>
                </div>
                
                <div class="test-cases">
                    <h3>Test Cases</h3>
                    <div class="test-case" id="test-cases">
                        <!-- Test cases will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
